[workspace]
resolver = "3"
members = ["core", "cli", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

# GPUI в неоптимизированной сборке непригоден: layout, шейпинг текста и tessellation
# без оптимизаций дают сотни миллисекунд на кадр — ввод в поле становится пыткой.
# Собираем зависимости с оптимизацией даже в dev, свой крейт оставляем быстрым в сборке.
# Это же рекомендует Zed для своих приложений.
[profile.dev.package."*"]
opt-level = 3

# Приложение тоже чуть оптимизируем: отладчик остаётся, но кадры перестают «жевать».
[profile.dev]
opt-level = 1
debug = 1
