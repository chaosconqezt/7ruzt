name: Build Linux

on:
  push:
  workflow_dispatch:
    inputs:
      profile:
        description: "Профиль cargo: release — готовый бинарник, dev — с отладочной информацией"
        type: choice
        options: [release, dev]
        default: release

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu
  VENDOR: vendor/7zip/linux-x64
  # Пуш всегда собирает release. dev — только ручной запуск (Run workflow).
  PROFILE: ${{ github.event.inputs.profile || 'release' }}

jobs:
  build:
    # 24.04 — glibc 2.39. Если нужен бинарник для старых дистрибутивов,
    # поменяйте на ubuntu-22.04 (glibc 2.35), набор пакетов тот же.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # gpui-pre — снапшот Zed, поэтому набор повторяет то, что Zed требует для Linux.
      # Часть библиотек (wayland, EGL, Vulkan) грузится через dlopen и на линковку
      # не влияет, но их -dev пакеты дают симлинки и .pc, которые запрашивают
      # фреймворки; без libxkbcommon* падает уже финальный `cc`.
      - name: Системные библиотеки для gpui/wgpu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}
          # true, пока разбираемся со smoke: иначе падение проверки выбрасывает
          # сборку и каждая итерация стоит полного билда.
          # Вернуть false, когда проверки станут зелёными.
          cache-on-failure: true

      # cargo кладёт dev-сборку в target/<target>/debug, а release — в .../release.
      - name: Каталог профиля
        id: profile
        run: |
          if [ "$PROFILE" = "dev" ]; then
            dir=debug
          else
            dir="$PROFILE"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # --locked: Cargo.lock лежит в репозитории, версии зависимостей не плывут.
      # continue-on-error нужен, чтобы ниже вытащить из лога читаемую причину.
      - name: Сборка
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          cargo build --profile "$PROFILE" --locked --target "$TARGET" -p archiver-app 2>&1 | tee build.log

      # У ошибки линковки ~мегабайт `= note:` с полным вызовом cc и списком rlib.
      # Оставляем только строки, по которым видно причину.
      - name: Сборка — что именно сломалось
        if: steps.build.outcome == 'failure'
        run: |
          grep -E '/usr/bin/ld:|^ld:|Undefined symbols|undefined reference|cannot find -l|ld: symbol\(s\) not found|collect2|signal 9|No space left|^error(\[|:)|failed to run custom build|caught signal' build.log | tail -n 60 \
            || echo 'причина не опознана — смотрите полный лог шага «Сборка»'
          exit 1

      # Разово для разбора: build.rs ядра должен положить 7zz и License.txt
      # рядом с бинарником, но на CI их нет. Смотрим, что видит сборка.
      - name: Диагностика 7zz
        if: always()
        run: |
          echo "== vendor в чекауте"
          ls -la "$VENDOR" || echo "::error::vendor нет в чекауте"
          echo "== где 7zz и License.txt в target"
          find "target/$TARGET" \( -name 7zz -o -name License.txt \) -print 2>/dev/null | head -n 20 || true
          echo "== предупреждения сборки"
          grep -n 'warning' build.log | head -n 30 || true
          # В cargo build-скрипт складывает свой stdout сюда: если копирование
          # падало, тут будет `cargo:warning=...` с текстом ошибки ОС.
          echo "== вывод build-скрипта ядра"
          cat target/"$TARGET"/"${{ steps.profile.outputs.dir }}"/build/archiver-core-*/output 2>/dev/null \
            || echo "output не найден — build-скрипт ядра не выполнялся"

      # Проверка не блокирует выкладку: артефакт загрузится даже при её падении,
      # но джобу всё равно завалит шаг «Итог smoke» после выкладки.
      - name: "Smoke test — бинарник и 7zz на месте"
        id: smoke
        continue-on-error: true
        run: |
          dir="target/$TARGET/${{ steps.profile.outputs.dir }}"
          echo "каталог: $dir"
          ls -la "$dir" || echo "::error::каталога нет"

          for f in archiver-app 7zz; do
            if [ ! -e "$dir/$f" ]; then
              echo "::error::$f нет в $dir"
              exit 1
            fi
            if [ ! -x "$dir/$f" ]; then
              echo "::error::$f без бита исполнения: $(ls -l "$dir/$f")"
              exit 1
            fi
          done

          if command -v file > /dev/null; then
            echo "file: $(file -b "$dir/7zz")"
            echo "file: $(file -b "$dir/archiver-app")"
          else
            echo "::warning::file не установлен — проверка архитектуры пропущена"
          fi

          set +e
          "$dir/7zz" i > /dev/null
          code=$?
          set -e
          echo "7zz i: exit=$code"
          if [ "$code" -ne 0 ]; then
            "$dir/7zz" i 2>&1 | tail -n 10
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: archiver-linux-x86_64-${{ env.PROFILE }}
          if-no-files-found: error
          path: |
            target/${{ env.TARGET }}/${{ steps.profile.outputs.dir }}/archiver-app
            target/${{ env.TARGET }}/${{ steps.profile.outputs.dir }}/7zz
            target/${{ env.TARGET }}/${{ steps.profile.outputs.dir }}/License.txt

      - name: Итог smoke
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "::error::smoke test упал — смотрите вывод шага «Smoke test»"
          exit 1
