name: Build Linux

on: [push, workflow_dispatch]

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Системные библиотеки для gpui/wgpu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libfontconfig1-dev libfreetype-dev libxcb1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}
          cache-on-failure: false

      - run: cargo build --release --locked --target ${{ env.TARGET }} -p archiver-app

      - name: "Smoke test — архитектура x86-64, 7zz рядом и запускается"
        run: |
          bin="target/${{ env.TARGET }}/release/archiver-app"
          test -x "$bin"
          file "$bin" | grep -q 'x86-64'
          test -x "target/${{ env.TARGET }}/release/7zz"
          "target/${{ env.TARGET }}/release/7zz" i > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: archiver-linux-x86_64
          if-no-files-found: error
          path: |
            target/${{ env.TARGET }}/release/archiver-app
            target/${{ env.TARGET }}/release/7zz
            target/${{ env.TARGET }}/release/License.txt
