name: Build macOS

on:
  push:
  workflow_dispatch:
    inputs:
      profile:
        description: "Профиль cargo: release — готовый бинарник, dev — с отладочной информацией"
        type: choice
        options: [release, dev]
        default: release

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-apple-darwin
  # Пуш всегда собирает release. dev — только ручной запуск (Run workflow).
  PROFILE: ${{ github.event.inputs.profile || 'release' }}

jobs:
  build:
    # Intel-only, поэтому матрица не нужна.
    # macos-13 (Ventura) снят с поддержки 4 декабря 2025 — на нём этот воркфлоу
    # не запустится. macos-15-intel — последний x86_64-образ Actions,
    # доступен до августа 2027.
    # Если Intel-раннер уберут: собирать тут же кросс-сборкой на arm64
    # (`--target x86_64-apple-darwin` уже указан явно, менять ничего не придётся).
    runs-on: macos-15-intel
    steps:
      # checkout/upload-artifact — JS-экшены, node в них поставляет раннер.
      # v4 ещё собирался под node20, с 2026-го он EOL: раннер гоняет его через
      # node24 и сыплет предупреждением. В v7 рантайм уже node24.
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      # Кэш cargo-реестра, git-зависимостей и target/.
      # Ключ включает версию rustc, хеш Cargo.lock и наш target — при их смене
      # кэш сам инвалидируется, руками версии поднимать не надо.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}
          # Кэшировать только успешные сборки: битый target/ после падения
          # на следующий прогон лучше не тащить.
          cache-on-failure: false

      # cargo кладёт dev-сборку в target/<target>/debug, а release — в .../release.
      # Дальше по воркфлоу путь берётся из этого вывода, чтобы профиль менялся
      # в одном месте — в PROFILE выше.
      - name: Каталог профиля
        id: profile
        run: |
          if [ "$PROFILE" = "dev" ]; then
            dir=debug
          else
            dir="$PROFILE"
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # build.rs ядра кладёт вендоренный 7zz и License.txt рядом с бинарником
      # в target/<target>/<профиль> — поэтому --target обязателен и здесь.
      # --locked: Cargo.lock лежит в репозитории, версии зависимостей не плывут.
      # continue-on-error нужен, чтобы ниже вытащить из лога читаемую причину.
      - name: Сборка
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          cargo build --profile "$PROFILE" --locked --target "$TARGET" -p archiver-app 2>&1 | tee build.log

      # У ошибки линковки ~мегабайт `= note:` с полным вызовом cc и списком rlib.
      # Оставляем только строки, по которым видно причину.
      - name: Сборка — что именно сломалось
        if: steps.build.outcome == 'failure'
        run: |
          grep -E '/usr/bin/ld:|^ld:|Undefined symbols|undefined reference|cannot find -l|ld: symbol\(s\) not found|collect2|signal 9|No space left|^error(\[|:)|failed to run custom build|caught signal' build.log | tail -n 60 \
            || echo 'причина не опознана — смотрите полный лог шага «Сборка»'
          exit 1

      - name: "Smoke test — архитектура x86_64, 7zz рядом и запускается"
        run: |
          dir="target/$TARGET/${{ steps.profile.outputs.dir }}"
          test -x "$dir/archiver-app"
          lipo -info "$dir/archiver-app" | grep -q x86_64
          test -x "$dir/7zz"
          "$dir/7zz" i > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: archiver-macos-x86_64-${{ env.PROFILE }}
          if-no-files-found: error
          path: |
            target/${{ env.TARGET }}/${{ steps.profile.outputs.dir }}/archiver-app
            target/${{ env.TARGET }}/${{ steps.profile.outputs.dir }}/7zz
            target/${{ env.TARGET }}/${{ steps.profile.outputs.dir }}/License.txt
