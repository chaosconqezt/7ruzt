name: Build macOS

on: [push, workflow_dispatch]

# Одна и та же ветка не должна собираться дважды: новый пуш отменяет прошлый прогон.
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-apple-darwin

jobs:
  build:
    # Intel-only, поэтому матрица не нужна.
    # macos-13 (Ventura) снят с поддержки 4 декабря 2025 — на нём этот воркфлоу
    # просто не запустится. macos-15-intel — последний x86_64-образ Actions,
    # он доступен до августа 2027.
    # Если Intel-раннер уберут: собирать тут же кросс-сборкой на arm64
    # (`--target x86_64-apple-darwin` уже указан явно, менять ничего не придётся).
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      # Кэш cargo-реестра, git-зависимостей и target/.
      # Ключ включает версию rustc, хеш Cargo.lock и наш target — при их смене
      # кэш сам инвалидируется, руками версии поднимать не надо.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}
          # Кэшировать только успешные сборки: битый target/ после падения
          # на следующий прогон лучше не тащить.
          cache-on-failure: false

      # build.rs ядра кладёт вендоренный 7zz и License.txt рядом с бинарником
      # в target/<target>/release — поэтому --target обязателен и здесь.
      - run: cargo build --release --locked --target ${{ env.TARGET }} -p archiver-app

      - name: "Smoke test — архитектура x86_64, 7zz рядом и запускается"
        run: |
          bin="target/${{ env.TARGET }}/release/archiver-app"
          test -x "$bin"
          lipo -info "$bin" | grep -q x86_64
          test -x "target/${{ env.TARGET }}/release/7zz"
          "target/${{ env.TARGET }}/release/7zz" i > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: archiver-macos-x86_64
          if-no-files-found: error
          path: |
            target/${{ env.TARGET }}/release/archiver-app
            target/${{ env.TARGET }}/release/7zz
            target/${{ env.TARGET }}/release/License.txt
