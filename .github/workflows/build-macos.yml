name: Build macOS

on: [push, workflow_dispatch]

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-apple-darwin

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      # checkout/upload-artifact — JS-экшены, node в них поставляет раннер.
      # v4 ещё собирался под node20, с 2026-го он EOL: раннер гоняет его через
      # node24 и сыплет предупреждением. В v7 рантайм уже node24.
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}
          # Кэшировать только успешные сборки: битый target/ после падения
          # на следующий прогон лучше не тащить.
          cache-on-failure: false

      # build.rs ядра кладёт вендоренный 7zz и License.txt рядом с бинарником
      # в target/<target>/release — поэтому --target обязателен и здесь.
      # --locked: Cargo.lock лежит в репозитории, версии зависимостей не плывут.
      - run: cargo build --release --locked --target ${{ env.TARGET }} -p archiver-app

      - name: "Smoke test — архитектура x86_64, 7zz рядом и запускается"
        run: |
          bin="target/${{ env.TARGET }}/release/archiver-app"
          test -x "$bin"
          lipo -info "$bin" | grep -q x86_64
          test -x "target/${{ env.TARGET }}/release/7zz"
          "target/${{ env.TARGET }}/release/7zz" i > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: archiver-macos-x86_64
          if-no-files-found: error
          path: |
            target/${{ env.TARGET }}/release/archiver-app
            target/${{ env.TARGET }}/release/7zz
            target/${{ env.TARGET }}/release/License.txt
